function anyKm(a,b){const A=anyLL(a),B=anyLL(b);return A&&B?Math.round(haversineKm(A,B)):null;}
function enrichPlannedList(rawList,apFn=apt){
  const pre=(rawList||[]).map((p,i)=>({
    ...p,
    id:p.id||('pl_'+i),
    dist:(Number(p.dist)>0?Number(p.dist):(anyKm(p.from,p.to)||''))
  }));
  return enrichFlights(pre,apFn);
}
function buildPlannedTrips(enrList){
  if(!enrList||!enrList.length)return [];
  const bases=inferHomeBases(derive());
  return buildTrips(enrList,bases);
}
function computePlannedMilestones(enrList){
  const hist=derive();
  const seenC=new Set(),seenAp=new Set(),seenRt=new Set(),seenAl=new Set(),seenAc=new Set();
  hist.forEach(f=>{
    const A=apt(f.from),B=apt(f.to);
    if(A?.country)seenC.add(A.country);
    if(B?.country)seenC.add(B.country);
    if(f.from)seenAp.add(String(f.from).toUpperCase());
    if(f.to)seenAp.add(String(f.to).toUpperCase());
    if(f.from&&f.to&&f.from!==f.to)seenRt.add([f.from,f.to].map(x=>String(x).toUpperCase()).sort().join('|'));
    if(f.airline)seenAl.add(norm(f.airline));
    if(f.ac)seenAc.add(norm(f.ac));
  });
  const baseCount=hist.length;
  const perId=new Map();
  const sumNewC=new Set(),sumNewAp=new Set(),sumNewRt=new Set(),sumNewAl=new Set(),sumNewAc=new Set();
  enrList.forEach((p,idx)=>{
    const tags=[];
    const fc=String(p.from||'').toUpperCase(),tc=String(p.to||'').toUpperCase();
    const A=apt(fc),B=apt(tc);
    const num=baseCount+idx+1;
    if(num>=50&&(num%25===0||(num>=100&&num%20===0)))tags.push({cls:'milestone',lbl:`Volo #${num}`});
    [A?.country,B?.country].filter(Boolean).forEach(c=>{
      if(!seenC.has(c)){seenC.add(c);sumNewC.add(c);tags.push({cls:'',lbl:`Nuovo paese: ${c}`});}
    });
    [fc,tc].filter(Boolean).forEach(c=>{
      if(!seenAp.has(c)){seenAp.add(c);sumNewAp.add(c);tags.push({cls:'',lbl:`Nuovo aeroporto: ${c}`});}
    });
    if(fc&&tc&&fc!==tc){
      const rk=[fc,tc].sort().join('|');
      if(!seenRt.has(rk)){seenRt.add(rk);sumNewRt.add(rk);tags.push({cls:'',lbl:'Nuova rotta'});}
    }
    if(p.airline){
      const ak=norm(p.airline);
      if(ak&&!seenAl.has(ak)){seenAl.add(ak);sumNewAl.add(p.airline);tags.push({cls:'',lbl:`Nuova compagnia: ${p.airline}`});}
    }
    if(p.ac){
      const ack=norm(p.ac);
      if(ack&&!seenAc.has(ack)){seenAc.add(ack);sumNewAc.add(p.ac);tags.push({cls:'aircraft',lbl:`Nuovo aereo: ${p.ac}`});}
    }
    perId.set(p.id,tags);
  });
  return {perId,newCountries:[...sumNewC],newAps:[...sumNewAp],newAircraft:[...sumNewAc],newRoutes:sumNewRt.size,newAirlines:[...sumNewAl]};
}
function matchPeerPlanned(enrList){
  if(!peer||!Array.isArray(peer.planned)||!peer.planned.length)return {sharedByMyId:new Map(),peerOnly:[]};
  const pEnr=enrichPlannedList(peer.planned,peerApt);
  const used=new Set(),sharedByMyId=new Map();
  const byKey=new Map();
  pEnr.forEach(pf=>{
    const k=`${pf.date}|${String(pf.from).toUpperCase()}|${String(pf.to).toUpperCase()}`;
    if(!byKey.has(k))byKey.set(k,[]);
    byKey.get(k).push(pf);
  });
  enrList.forEach(mf=>{
    const k=`${mf.date}|${String(mf.from).toUpperCase()}|${String(mf.to).toUpperCase()}`;
    const cands=(byKey.get(k)||[]).filter(pf=>!used.has(pf.id));
    if(!cands.length)return;
    const mF=normFlight(mf.flight);
    const pick=cands.find(pf=>mF&&normFlight(pf.flight)===mF)||cands[0];
    used.add(pick.id);
    sharedByMyId.set(mf.id,pick);
  });
  return {sharedByMyId,peerOnly:pEnr.filter(pf=>!used.has(pf.id))};
}
function todayISOAt(offsetMin,nowMs=Date.now()){
  if(offsetMin==null)return todayISO();
  const d=new Date(nowMs+offsetMin*60000);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
function plannedArrivalUtcMs(p,depOff,arrOff){
  if(!p||!isISO(p.date))return null;
  const am=toMin(p.arr);
  if(am==null)return null;
  const baseUtc=dnum(p.date)*86400000;
  const toOff=arrOff!=null?arrOff:(depOff!=null?depOff:-new Date(baseUtc).getTimezoneOffset());
  const fromOff=depOff!=null?depOff:toOff;
  const dm=toMin(p.dep);
  let arrUtc=baseUtc+(am-toOff)*60000;
  if(dm!=null){
    const depUtc=baseUtc+(dm-fromOff)*60000;
    while(arrUtc<=depUtc)arrUtc+=86400000;
  }
  return arrUtc;
}
function plannedCountdown(p,nowMs=Date.now(),apFn=apt){
  const iso=typeof p==='string'?p:p?.date;
  if(!isISO(iso))return {diff:null,due:false,landed:false,lbl:''};
  const pcOff=-new Date(nowMs).getTimezoneOffset();
  const rowFn=c=>apFn===peerApt?(peer?.ap?.[String(c||'').toUpperCase()]||IDX.ap[String(c||'').toUpperCase()]):IDX.ap[String(c||'').toUpperCase()];
  const depRaw=typeof p==='object'&&p?aptOffsetMinAt(p.from,iso,p.dep,rowFn):null;
  const arrRaw=typeof p==='object'&&p?aptOffsetMinAt(p.to,iso,p.arr,rowFn):null;
  const depOff=depRaw!=null?depRaw:pcOff;
  const arrOff=arrRaw!=null?arrRaw:depOff;
  const todayDep=todayISOAt(depOff,nowMs);
  const diff=dnum(iso)-dnum(todayDep);
  const arrUtc=typeof p==='object'&&p?plannedArrivalUtcMs(p,depOff,arrOff):null;
  let landed=false;
  if(arrUtc!=null){
    landed=nowMs>=arrUtc;
  }else{
    const todayArr=todayISOAt(arrOff,nowMs);
    landed=dnum(iso)<dnum(todayArr);
  }
  const due=landed||diff<=0;
  const lbl=landed?'da registrare':(diff>1?`tra ${nf.format(diff)} giorni`:diff===1?'domani':'oggi');
  return {diff,due,landed,lbl};
}

// Colonne calcolate (come nel file Excel)
const AC_COMPUTED={11:'apertura² / superficie',15:'MTOW − OEW',23:'MTOW × 1000 / superficie, in kg/m²',28:'spinta / (MTOW × 9,81), adimensionale'};
function parseMaxFan(raw){
  if(raw==null||raw===''||raw==='/')return '';
  const nums=String(raw).split(/\s*\/\/\s*/).map(numSortVal).filter(v=>v!=null);
  return nums.length?Math.max(...nums):'';
}
function computeAircraft(r){
  const n=i=>typeof r[i]==='number'?r[i]:NaN;
  const b=n(9),Sw=n(10),oew=n(13),mtow=n(14),T=n(27);
  r[11]=b>0&&Sw>0?b*b/Sw:'';          // allungamento AR = b²/S  [b in m, S in m²]
  r[15]=mtow>=0&&oew>=0?mtow-oew:'';   // carico utile [t]
  r[23]=mtow>0&&Sw>0?mtow*1000/Sw:'';  // carico alare W/S [kg/m²]
  r[26]=parseMaxFan(r[25]);            // massimo diametro del fan [m]
  r[28]=T>0&&mtow>0?T/(mtow*9.81):'';  // T/W: kN / (t × 9,81 m/s² = kN) → adimensionale
  return r;
}
function yearFlights(){return ui.year==='all'?S.flights:S.flights.filter(f=>+String(f.date).slice(0,4)===ui.year);}
function flownCount(model){return yearFlights().filter(f=>f.ac===model).length;}
function topAircraft(exclude){
  return [...S.aircraft.rows].filter(r=>r[0]!==exclude).sort((a,b)=>flownCount(b[0])-flownCount(a[0])||String(a[0]).localeCompare(String(b[0]))).map(r=>r[0]);
}
function topAirports(exclude){
  return [...S.airports.rows].filter(r=>r[0]!==exclude).sort((a,b)=>movements(b[0])-movements(a[0])||String(a[0]).localeCompare(String(b[0]))).map(r=>r[0]);
}
function numSortVal(v){
  if(v==null||v===''||v==='/')return null;
  if(typeof v==='number')return isNaN(v)?null:v;
  let s=String(v).replace(/\+/g,'').trim();
  if(s.includes('.')&&s.includes(',')){
    if(s.indexOf('.')<s.indexOf(',')) s=s.replace(/\./g,'').replace(',','.');
    else s=s.replace(/,/g,'');
  }else if(s.includes(',')){
    s=s.replace(',','.');
  }else if((s.match(/\./g)||[]).length>1){
    s=s.replace(/\./g,'');
  }
  const n=parseFloat(s);
  return isNaN(n)?null:n;
}

function matchAircraftQuery(r,rawQ){

function matchAirportQuery(r,rawQ){

function winCells(vals,dir=1){
 const nums=vals.map(numSortVal),valid=nums.filter(v=>v!=null);
 if(valid.length<2)return ['num','num','num'];
 const best=dir>0?Math.max(...valid):Math.min(...valid);

 return nums.map(v=>v===best?'num win':'num');
}

/* ---------------- form generico (aerei / aeroporti) ---------------- */
function parseCell(s){
  s=String(s??'').trim();if(s==='')return '';
  let clean=s.replace(/^[−–]\s*/,'-');
  if(clean.includes('.')&&clean.includes(',')){
    if(clean.indexOf('.')<clean.indexOf(',')) clean=clean.replace(/\./g,'').replace(',','.');
    else clean=clean.replace(/,/g,'');
  }else if(clean.includes(',')){
    clean=clean.replace(',','.');
  }else if((clean.match(/\./g)||[]).length>1){
    clean=clean.replace(/\./g,'');
  }
  if(/^-?\d+(\.\d+)?$/.test(clean))return Number(clean);
  return s;
}
const normAiKey=s=>norm(s).replace(/km\s*[²2\^]+/g,'km2').replace(/[\*`_:\(\)°]/g,' ').replace(/\s+/g,' ').trim();
function parseAiAirportText(txt,cols){
  const keyMap=new Map();
  (cols||[]).forEach((c,i)=>{
    if(i===14||i===15||i===16||i===17)return;
    keyMap.set(normAiKey(c),i);
    keyMap.set(normAiKey(String(c).replace(/\([^)]*\)/g,'')),i);
  });
  const aliases={
    'codice iata':0,'iata':0,'nome':1,'codice icao':2,'icao':2,'continente':3,'stato':4,'paese':4,'citta':5,
    'fuso orario':6,'altitudine':7,'altitudine m':7,'temperatura media nei mesi caldi':8,'temperatura media nei mesi caldi c':8,
    'distanza dal centro citta':9,'distanza dal centro citta km':9,'passeggeri annui':10,'passeggeri annui milioni':10,
    'superficie':11,'superficie km2':11,'numero terminal':12,'numero gate':13,'numero gate approssimativo':13,
    'categoria icao':18,'categoria ils massima':19,'coprifuoco notturno':20,
    'latitudine':21,'longitudine':22,'dettaglio piste':23
  };
  Object.entries(aliases).forEach(([k,i])=>{if(!keyMap.has(k))keyMap.set(k,i);});
  const numCols=new Set([7,8,9,10,11,12,13,21,22]);
  const out={};
  String(txt||'').split(/\r?\n/).forEach(rawLine=>{
    const line=rawLine.trim().replace(/^(?:[\*\-•]|\d+[\.\)])\s*/,'');
    const m=line.match(/^([^:]{2,80}):\s*(.+)$/);
    if(!m)return;
    const kNorm=normAiKey(m[1]);
    let idx=keyMap.get(kNorm);
    if(idx==null)idx=keyMap.get(normAiKey(m[1].replace(/\([^)]*\)/g,'')));
    if(idx==null)idx=keyMap.get(kNorm.replace(/\bm\b|\bkm\b|\bmilioni\b|\bapprossimativo\b/g,'').replace(/\s+/g,' ').trim());
    if(idx==null)return;
    let val=m[2].trim().replace(/^`+|`+$/g,'').replace(/^\*\*|\*\*$/g,'').trim();
    if(/^\[.*\]$/.test(val))return;
    if(idx===0||idx===2)val=val.toUpperCase();
    else if(idx===4)val=canonicalCountry(val);
    else if(numCols.has(idx)){
      const cleaned=val.replace(/\s*(?:m|km|°c|°|mln|milioni|km²|km2)\s*$/i,'').trim();
      const num=parseCell(cleaned);
      if(typeof num==='number')val=String(num);
    }
    out[idx]=val;
  });
  return {values:out,count:Object.keys(out).length};
}

      <div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn sm" id="aiPasteCloseBtn">Chiudi</button><button type="button" class="btn sm primary" id="aiPasteApplyBtn">Applica campi</button></div>
    </div>
  </div>`;
  el.innerHTML=`${head(idx>=0?'Modifica '+vals[0]:(isAc?'Nuovo modello':'Nuovo aeroporto'))}
  <form class="form" novalidate autocomplete="off">
    ${aiBoxHTML}
    ${T.groups.map(([g,a,b])=>`<fieldset><legend>${esc(g)}</legend><div class="grid">${range(a,b).filter(i=>!rwyAuto[i]&&!(isAc&&i===26)).map(i=>{
      const isRw=!isAc&&T.cols[i]===RWYC;
      const rwSt=isRw&&vals[i]?parseRunwayStats(vals[i]):null;
      const rwHint=rwSt?`Calcolato in automatico: ${rwSt.count} ${rwSt.count===1?'pista':'piste'} · max ${rwSt.max||'—'} m · min ${rwSt.min||'—'} m · largh. ${rwSt.wid||'—'} m`:'Separa le piste con // (es. 17L/35R · 3920×60 m // 17R/35L · 3920×60 m): calcola in automatico N° piste, più lunga, più corta e più larga';
      const hText=comp[i]?'Calcolato: '+esc(comp[i]):(isAc&&i===25?'Per più motori separa con // (es. 1,98 // 2,06)':(!isAc&&i===6?'Formato UTC +1':(!isAc&&T.cols[i]===LATC?'Gradi decimali, nord positivo (es. 45,63)':(!isAc&&T.cols[i]===LONC?'Gradi decimali, est positivo (es. 8,72)':(isRw?rwHint:'')))));
      return fld('c'+i,T.cols[i],`<input id="i-c${i}" name="c${i}" value="${esc(display(vals[i],i))}" ${comp[i]?'readonly tabindex="-1"':''} ${i===0&&idx<0&&!vals[0]?'autofocus':''} ${!isAc&&i===0?'class="upper" maxlength="4"':''} ${isRw?'placeholder="17L/35R · 3920×60 m // 17R/35L · 3920×60 m"':''}>`,hText,isRw);
    }).join('')}</div></fieldset>`).join('')}
    <div class="actions"><button type="button" class="btn" data-close>Annulla</button><button type="submit" class="btn primary">Salva</button></div>
  </form>`;
  const form=el.querySelector('form');
  if(!isAc){
    const wrap=form.querySelector('#aiPasteWrap'),area=form.querySelector('#aiPasteArea'),rwyIdx=T.cols.indexOf(RWYC);
    const applyAi=rawTxt=>{
      const res=parseAiAirportText(rawTxt,T.cols);
      if(!res.count){toast('Nessun campo riconosciuto nel testo incollato.');return false;}
      Object.entries(res.values).forEach(([colIdx,val])=>{
        const inp=form.elements['c'+colIdx];
        if(!inp)return;
        inp.value=val;inp.classList.add('autofilled');
        const f=inp.closest('.f');if(f){f.classList.remove('err');const m=f.querySelector('.msg');if(m)m.textContent='';}
      });
      if(rwyIdx>=0&&res.values[rwyIdx]!=null){
        const st=parseRunwayStats(res.values[rwyIdx]);
        const hintEl=form.querySelector('[data-hint=c'+rwyIdx+']');
        if(hintEl)hintEl.textContent=st?`Calcolato in automatico: ${st.count} ${st.count===1?'pista':'piste'} · max ${st.max||'—'} m · min ${st.min||'—'} m · largh. ${st.wid||'—'} m`:'Separa le piste con // (es. 17L/35R · 3920×60 m // 17R/35L · 3920×60 m): calcola in automatico N° piste, più lunga, più corta e più larga';
      }
      toast(`Compilati ${res.count} campi dalla scheda AI`);
      return true;
    };
    form.querySelector('#aiPasteClipBtn')?.addEventListener('click',async()=>{
      try{
        if(!navigator.clipboard?.readText)throw new Error('no-clip');
        const txt=await navigator.clipboard.readText();
        if(!txt||!txt.trim())throw new Error('empty');
        if(applyAi(txt)&&wrap)wrap.hidden=true;
      }catch(_){
        if(wrap){wrap.hidden=false;area?.focus();toast('Incolla il testo qui sotto e premi Applica.');}
      }
    });
    form.querySelector('#aiPasteToggleBtn')?.addEventListener('click',()=>{if(wrap){wrap.hidden=!wrap.hidden;if(!wrap.hidden)area?.focus();}});
    form.querySelector('#aiPasteCloseBtn')?.addEventListener('click',()=>{if(wrap)wrap.hidden=true;});
    form.querySelector('#aiPasteApplyBtn')?.addEventListener('click',()=>{if(area&&applyAi(area.value)&&wrap)wrap.hidden=true;});
    area?.addEventListener('paste',()=>setTimeout(()=>{if(applyAi(area.value)&&wrap)wrap.hidden=true;},20));
  }
  form.addEventListener('input',e=>{e.target.classList&&e.target.classList.remove('autofilled');const f=e.target.closest('.f');if(f){f.classList.remove('err');f.querySelector('.msg').textContent='';}
    if(isAc){const r=T.cols.map((c,i)=>parseCell(form.elements['c'+i]?.value));computeAircraft(r);Object.keys(comp).forEach(i=>{if(form.elements['c'+i])form.elements['c'+i].value=typeof r[i]==='number'?nf2.format(r[i]):'';});}
    else if(e.target.name==='c'+T.cols.indexOf(RWYC)){
      const st=parseRunwayStats(e.target.value);
      const hintEl=form.querySelector('[data-hint=c'+T.cols.indexOf(RWYC)+']');
      if(hintEl){
        hintEl.textContent=st?`Calcolato in automatico: ${st.count} ${st.count===1?'pista':'piste'} · max ${st.max||'—'} m · min ${st.min||'—'} m · largh. ${st.wid||'—'} m`:'Separa le piste con // (es. 17L/35R · 3920×60 m // 17R/35L · 3920×60 m): calcola in automatico N° piste, più lunga, più corta e più larga';
      }
    }
  });
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const r=T.cols.map((c,i)=>form.elements['c'+i]?parseCell(form.elements['c'+i].value):(idx>=0?vals[i]:''));
    if(!isAc){const ri=T.cols.indexOf(RWYC),st=ri>=0?parseRunwayStats(r[ri]):null;Object.entries(rwyAuto).forEach(([i,k])=>{r[i]=st&&st[k]!=null?st[k]:(idx>=0?vals[i]:'/');});r[0]=String(r[0]).toUpperCase();if(r[4])r[4]=canonicalCountry(r[4],T.rows.filter((_,j)=>j!==idx));}
    if(isAc)computeAircraft(r);
    const k=String(r[0]).trim();
    const dup=T.rows.findIndex(x=>String(x[0]).toUpperCase()===k.toUpperCase());
    let err='';if(!k)err=isAc?'Inserisci il nome del modello':'Inserisci il codice IATA';else if(dup>=0&&dup!==idx)err='Esiste già nell’archivio';
    if(err){const f=form.querySelector('[data-f=c0]');f.classList.add('err');f.querySelector('.msg').textContent=err;form.elements.c0.focus();return;}
    if(!isAc){const li=T.cols.indexOf(LATC),oi=T.cols.indexOf(LONC);for(const [i,m] of [[li,90],[oi,180]]){if(i<0)continue;const v=r[i];if(v!==''&&!(typeof v==='number'&&Math.abs(v)<=m)){const f=form.querySelector(`[data-f=c${i}]`);f.classList.add('err');f.querySelector('.msg').textContent=`Numero tra −${m} e ${m}`;form.elements['c'+i].focus();return;}}}
    let moved=0;
    if(idx>=0){
      const old=String(T.rows[idx][0]);T.rows[idx]=r;
      if(old!==k)S.flights.concat(S.planned).forEach(f=>{if(isAc&&f.ac===old){f.ac=k;moved++;}if(!isAc){if(f.from===old){f.from=k;moved++;}if(f.to===old){f.to=k;moved++;}}});
    }else T.rows.push(r);
    buildIndex();commit();closeSheet();render();
    toast(`${k} salvato${moved?`, aggiornati anche ${moved} riferimenti nei voli`:''}`);
  });
};}

/* ---------------- archivio e backup ---------------- */
let saveFileHandle=null;
function download(text,name,type){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
const stamp=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
function cleanHtmlForExport(str){
  return str.replace(/<style\s+class="darkreader[\s\S]*?<\/style>/gi,'').replace(/\s*data-(?:darkreader|extension|injected)[^=]*="[^"]*"/gi,'').replace(/<(?:div|span)\s+id="[^"]*(?:extension|darkreader|bitwarden|lastpass|grammarly)[^"]*"[\s\S]*?<\/(?:div|span)>/gi,'');
}
function buildExportHtml(o){
  const data=serialize(o).replace(/</g,'\\u003c');
  return cleanHtmlForExport(PRISTINE).replace(/(<script type="application\/json" id="seed">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+data+b);
}
function defaultExportName(o){
  const ow=String(o?.owner||'').trim().replace(/[^a-zA-Z0-9À-ÿ_-]+/g,'_').replace(/^_+|_+$/g,'');
  return ow?`SkyLog_${ow}.html`:'SkyLog.html';
}
function downloadCopyOf(o){
  download(buildExportHtml(o),defaultExportName(o),'text/html;charset=utf-8');
}
async function downloadCopy(forceSaveAs=false){
  const now=new Date().toISOString();
  const nextMeta={savedAt:now,exportedAt:now,base:now,unsynced:false};
  const html=buildExportHtml({...S,...nextMeta});
  const name=defaultExportName(S);
  if(typeof window.showSaveFilePicker==='function'){
    const writeTo=async h=>{
      const w=await h.createWritable();
      await w.write(html);
      await w.close();
    };
    const pick=()=>window.showSaveFilePicker({id:'skylog-export',suggestedName:name,types:[{description:'SkyLog HTML',accept:{'text/html':['.html','.htm']}}]});
    try{
      if(!saveFileHandle||forceSaveAs)saveFileHandle=await pick();
      try{
        await writeTo(saveFileHandle);
      }catch(err){
        if(err?.name==='AbortError')return;
        if(!forceSaveAs){saveFileHandle=await pick();await writeTo(saveFileHandle);}else throw err;
      }
      Object.assign(S,nextMeta);persist();
      if(sheet.open&&document.getElementById('ownerForm'))replaceSheet(menuSheet());
      toast(saveFileHandle?.name?`Salvato direttamente su ${saveFileHandle.name}`:'File aggiornato salvato');
      return;
    }catch(err){
      if(err?.name==='AbortError')return;
      saveFileHandle=null;
    }
  }
  Object.assign(S,nextMeta);persist();
  download(html,name,'text/html;charset=utf-8');
  if(sheet.open&&document.getElementById('ownerForm'))replaceSheet(menuSheet());
  toast('Copia aggiornata scaricata');
}
/* ---------------- PAESI E PASSAPORTO ---------------- */
const CONT_TOTALS={'Europa':44,'Asia':48,'Africa':54,'Nord America':23,'Sud America':12,'Oceania':14};
const UN_TOTAL=195;
function vCountries(){
  const all=derive();
  const years=allYears(all);
  if(ui.year!=='all'&&!years.includes(ui.year))ui.year='all';
  const Y=ui.year,fl=Y==='all'?all:all.filter(f=>f._y===Y);
  const allStats=computeCountryStats(fl);

  if(peer){
    const pFl=Y==='all'?peer.flights:peer.flights.filter(f=>f._y===Y);
    const pStats=computeCountryStats(pFl,peerApt,inferPeerBaseCountries(pFl,peerApt));
    const mapByC=new Map();
    const put=(c,key)=>{
      let cur=mapByC.get(c.country);
      if(!cur){cur={country:c.country,continent:c.continent,my:null,peer:null};mapByC.set(c.country,cur);}
      if(!cur.continent||cur.continent==='Altro')cur.continent=c.continent;
      cur[key]=c;
    };
    allStats.forEach(c=>put(c,'my'));
    pStats.forEach(c=>put(c,'peer'));
    const merged=[...mapByC.values()].map(c=>{
      const owner=c.my&&c.peer?'both':(c.my?'mine':'peer');
      const aps=new Set([...(c.my?.aps||[]),...(c.peer?.aps||[])]);
      const allAps=[...aps];
      const totalFlights=(c.my?.nFlights||0)+(c.peer?.nFlights||0);
      const lastYear=Math.max(c.my?.lastYear||0,c.peer?.lastYear||0);
      const firstYear=Math.min(c.my?.firstYear||9999,c.peer?.firstYear||9999);
      return {...c,owner,allAps,nAps:allAps.length,totalFlights,lastYear,firstYear:firstYear<9999?firstYear:0};
    });
    const bothList=merged.filter(c=>c.owner==='both');
    const mineOnlyList=merged.filter(c=>c.owner==='mine');
    const peerOnlyList=merged.filter(c=>c.owner==='peer');
    const combinedVisited=merged.filter(c=>(c.my&&!c.my.onlyTransit)||(c.peer&&!c.peer.onlyTransit));
    const combPct=nf1.format(Math.min(100,(combinedVisited.length/UN_TOTAL)*100));

    const prio={both:3,mine:2,peer:1};
    const byNum=new Map();
    const microDots=[];
    merged.forEach(c=>{
      const m=countryMeta(c.country);
      if(!m)return;
      const prev=byNum.get(m[1]);
      if(!prev||prio[c.owner]>prio[prev.owner])byNum.set(m[1],c);
      if(!WORLD_PATHS[m[1]]&&m[2])microDots.push({c,pt:neProj(m[2][0],m[2][1])});
    });
    const tipTxt=c=>`${c.country} · Tu: ${c.my?`${c.my.nFlights} ${c.my.nFlights===1?'volo':'voli'}`:'0'} · ${peer.name}: ${c.peer?`${c.peer.nFlights} ${c.peer.nFlights===1?'volo':'voli'}`:'0'}`;
    const ownerCls=o=>o==='both'?'both':(o==='mine'?'visited':'peer');
    const worldSVG=Object.entries(WORLD_PATHS).map(([id,d])=>{
      const hit=byNum.get(id);
      const cls=hit?`land ${ownerCls(hit.owner)}`:'land';
      const attr=hit?` data-country="${esc(hit.country)}" data-tip="${esc(tipTxt(hit))}" tabindex="0"`:'';
      return `<path class="${cls}" d="${d}"${attr}/>`;
    }).join('');
    const microSVG=microDots.map(({c,pt})=>`<circle class="micro ${ownerCls(c.owner)}" cx="${pt[0]}" cy="${pt[1]}" r="4.2" data-country="${esc(c.country)}" data-tip="${esc(tipTxt(c))}" tabindex="0"/>`).join('');

    const myByCont=new Map(),peerByCont=new Map(),combByCont=new Map();
    allStats.filter(c=>!c.onlyTransit).forEach(c=>myByCont.set(c.continent,(myByCont.get(c.continent)||0)+1));
    pStats.filter(c=>!c.onlyTransit).forEach(c=>peerByCont.set(c.continent,(peerByCont.get(c.continent)||0)+1));
    combinedVisited.forEach(c=>combByCont.set(c.continent,(combByCont.get(c.continent)||0)+1));
    const contBars=Object.entries(CONT_TOTALS).map(([cont,tot])=>{
      const myN=myByCont.get(cont)||0,peerN=peerByCont.get(cont)||0,combN=combByCont.get(cont)||0;
      const pct=Math.round((combN/tot)*100);
      return {l:cont,v:combN,s:`Tu ${myN} · ${peer.name} ${peerN} · Insieme ${combN}/${tot} (${pct}%)`,pct};
    });

    const cmpF=ui.countryCmpFilter||'all';
    const cSort=ui.countrySort||'flights';

    app.innerHTML=`<h1 class="page-title">Paesi · Confronto</h1><p class="page-sub">${bothList.length} in comune · ${mineOnlyList.length} solo tuoi · ${peerOnlyList.length} solo di ${esc(peer.name)}${Y!=='all'?' nel '+Y:''}</p>

    <div class="stats" style="margin-bottom:20px">
      <div class="stat"><div class="stat-label">Paesi in comune</div><div class="stat-val">${nf.format(bothList.length)}</div><div class="stat-sub">su ${nf.format(merged.length)} toccati insieme</div></div>
      <div class="stat"><div class="stat-label">Solo tuoi</div><div class="stat-val">${nf.format(mineOnlyList.length)}</div><div class="stat-sub">totale tuoi: ${nf.format(allStats.length)}</div></div>
      <div class="stat"><div class="stat-label">Solo di ${esc(peer.name)}</div><div class="stat-val">${nf.format(peerOnlyList.length)}</div><div class="stat-sub">totale ${esc(peer.name)}: ${nf.format(pStats.length)}</div></div>
      <div class="stat"><div class="stat-label">Visitati combinati</div><div class="stat-val">${nf.format(combinedVisited.length)}</div><div class="stat-sub">su ~${UN_TOTAL} stati (${combPct}%)</div></div>
    </div>

    <div class="map-card">
      <svg class="map-svg" viewBox="0 10 1000 475" role="img" aria-label="Planisfero confronto paesi">${worldSVG}${microSVG}</svg>
      <div class="map-tip" id="mapTip" hidden></div>
      <div class="map-legend">
        <span><i class="sw" style="background:#ffd60a"></i>In comune (${bothList.length})</span>
        <span><i class="sw" style="background:var(--accent)"></i>Solo tuoi (${mineOnlyList.length})</span>
        <span><i class="sw" style="background:#32ade6"></i>Solo ${esc(peer.name)} (${peerOnlyList.length})</span>
        <span><i class="sw" style="background:rgba(128,128,128,.2)"></i>Non visitati</span>
      </div>
    </div>

    <div class="panel" style="margin-top:20px">
      <div class="panel-head"><h2>Copertura per continente (visitati combinati)</h2></div>
      <ul class="bars">${contBars.map(x=>`<li class="bar" data-cont="${esc(x.l)}" tabindex="0"><div class="bar-top"><span class="bar-name">${esc(x.l)}</span><span class="bar-val">${nf.format(x.v)}</span></div><span class="bar-sub">${esc(x.s)}</span><div class="bar-track"><div class="bar-fill" style="--w:${x.pct}%"></div></div></li>`).join('')}</ul>
    </div>

    <div class="toolbar" style="margin-top:20px">
      <label class="search">${ICON.search}<input type="search" id="cq" placeholder="Cerca paese, continente o aeroporto (es. Giappone, CDG)" value="${esc(ui.cq||'')}" aria-label="Cerca paesi"></label>
      <div class="seg" role="group" aria-label="Filtro confronto paesi" id="cCmpSeg">
        <button type="button" data-cmpfilter="all" aria-pressed="${cmpF==='all'}">Tutti (${merged.length})</button>
        <button type="button" data-cmpfilter="both" aria-pressed="${cmpF==='both'}">In comune (${bothList.length})</button>
        <button type="button" data-cmpfilter="mine" aria-pressed="${cmpF==='mine'}">Solo tuoi (${mineOnlyList.length})</button>
        <button type="button" data-cmpfilter="peer" aria-pressed="${cmpF==='peer'}">Solo ${esc(peer.name)} (${peerOnlyList.length})</button>
      </div>
      ${sel('cSortSel',[['flights','Ordina: più voli'],['aps','Più aeroporti'],['year','Più recente'],['name','Nome A–Z']],cSort,'Ordinamento paesi')}
      <button class="btn link" id="creset" hidden>Azzera filtri</button>
    </div>

    <div id="countryList"></div>`;

    const drawCountries=()=>{
      const q=norm(ui.cq||''),cf=ui.countryCmpFilter||'all',so=ui.countrySort||'flights';
      let list=cf==='both'?bothList:(cf==='mine'?mineOnlyList:(cf==='peer'?peerOnlyList:merged));
      if(q)list=list.filter(c=>norm(c.country+' '+c.continent+' '+c.allAps.join(' ')).includes(q));
      list=[...list].sort((a,b)=>{
        if(so==='name')return a.country.localeCompare(b.country,'it');
        if(so==='aps')return (b.nAps-a.nAps)||(b.totalFlights-a.totalFlights)||a.country.localeCompare(b.country,'it');
        if(so==='year')return (b.lastYear-a.lastYear)||(b.totalFlights-a.totalFlights)||a.country.localeCompare(b.country,'it');
        return (b.totalFlights-a.totalFlights)||(b.nAps-a.nAps)||a.country.localeCompare(b.country,'it');
      });
      document.querySelectorAll('#cCmpSeg [data-cmpfilter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cmpfilter===cf)));
      const crBtn=document.getElementById('creset');if(crBtn)crBtn.hidden=!(q||cf!=='all');
      const cl=document.getElementById('countryList');
      if(cl)cl.innerHTML=list.length?`<div class="tiles">${list.map(c=>{
        const m=countryMeta(c.country),flag=flagHTML(m?.[0]);
        const badge=c.owner==='both'?'<span class="badge both">In comune</span>':(c.owner==='mine'?'<span class="badge">Solo tuo</span>':`<span class="badge peer">Solo ${esc(peer.name)}</span>`);
        return `<button class="tile" data-country="${esc(c.country)}">
          <div class="tile-top"><span class="tile-flag">${flag}</span>${badge}</div>
          <span class="tile-title">${esc(c.country)}</span>
          <span class="tile-sub">${esc(c.continent)} · ${c.nAps} ${c.nAps===1?'aeroporto':'aeroporti'} (${esc(c.allAps.slice(0,4).join(', '))}${c.nAps>4?'…':''})</span>
          <span class="tile-metric">Tu: ${nf.format(c.my?.nFlights||0)} · ${esc(peer.name)}: ${nf.format(c.peer?.nFlights||0)} voli</span>
        </button>`;
      }).join('')}</div>`:'<div class="empty"><b>Nessun risultato</b>Nessun paese corrisponde al filtro.</div>';
    };

    const svg=app.querySelector('.map-svg'),tip=document.getElementById('mapTip');
    if(svg&&tip){
      const move=e=>{
        const t=e.target.closest('[data-tip]');
        if(!t){tip.hidden=true;return;}
        tip.textContent=t.dataset.tip;tip.hidden=false;
        const r=svg.parentElement.getBoundingClientRect();
        const x=Math.min(r.width-12,Math.max(12,e.clientX-r.left));
        const y=Math.max(12,e.clientY-r.top-12);
        tip.style.left=x+'px';tip.style.top=y+'px';
      };
      svg.addEventListener('mousemove',move);
      svg.addEventListener('mouseleave',()=>{tip.hidden=true;});
    }
    const cq=document.getElementById('cq');
    if(cq)cq.addEventListener('input',()=>{ui.cq=cq.value;drawCountries();});
    const cs=document.getElementById('cSortSel');
    if(cs)cs.addEventListener('change',e=>{ui.countrySort=e.target.value;drawCountries();});
    document.getElementById('cCmpSeg')?.addEventListener('click',e=>{const b=e.target.closest('[data-cmpfilter]');if(b){ui.countryCmpFilter=b.dataset.cmpfilter;drawCountries();}});
    document.getElementById('creset')?.addEventListener('click',()=>{ui.cq='';ui.countryCmpFilter='all';if(cq)cq.value='';drawCountries();});
    drawCountries();
    return;
  }

  const visitedList=allStats.filter(c=>!c.onlyTransit);
  const transitList=allStats.filter(c=>c.onlyTransit);
  const continents=[...new Set(visitedList.map(c=>c.continent).filter(c=>c&&c!=='Altro'))];

  // Mappa SVG coropletica
  const byNum=new Map();
  const microDots=[];
  allStats.forEach(c=>{
    const m=countryMeta(c.country);
    if(!m)return;
    const prev=byNum.get(m[1]);
    if(!prev||(prev.onlyTransit&&!c.onlyTransit))byNum.set(m[1],c);
    if(!WORLD_PATHS[m[1]]&&m[2])microDots.push({c,iso2:m[0],pt:neProj(m[2][0],m[2][1])});
  });
  const worldSVG=Object.entries(WORLD_PATHS).map(([id,d])=>{
    const hit=byNum.get(id);

async function loadPeerProfile(p,btn){
  if(location.protocol==='file:'){
    toast(`Seleziona il file ${p.file} dalla cartella`);
    document.getElementById('peerFile')?.click();
    return;
  }
  const prevTxt=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='Caricamento…';}
  const cands=[`./${p.file}`,`./${p.file.replace(/\.html$/i,'')}`,p.url,`${p.url}.html`];
  for(const u of cands){
    try{
      const res=await fetch(u,{cache:'no-cache'});
      if(!res.ok)continue;
      const txt=await res.text();
      if(!/id=["']seed["']/i.test(txt))continue;
      loadPeerHTML(txt,p.file);
      if(ui.view==='globe')ui.globeColor='compare';
      closeSheet(true);renderPeerBanner();render();
      toast(`Confronto attivato con ${peer.name} (${nf.format(peer.flights.length)} voli)`);
      return;
    }catch(_){}
  }
  if(btn){btn.disabled=false;btn.textContent=prevTxt;}
  toast(`Caricamento diretto non riuscito: seleziona ${p.file}`);
  document.getElementById('peerFile')?.click();
}
function loadPeerHTML(txt,fileName){
  const m=txt.match(/<script[^>]*\bid=["']seed["'][^>]*>([\s\S]*?)<\/script>/i);
  if(!m)throw new Error('File non valido: archivio dati (#seed) non trovato.');
  const raw=JSON.parse(m[1]);
  const apMap={};(raw.airports?.rows||[]).forEach(r=>{apMap[String(r[0]||'').toUpperCase()]=r;});
  const acMap={};(raw.aircraft?.rows||[]).forEach(r=>{acMap[String(r[0]||'').trim()]=r;});
  const alNorm={};Object.entries(raw.alliances||{}).forEach(([k,v])=>{alNorm[k.trim().toLowerCase()]=v;});
  const apLook=c=>{const r=apMap[String(c||'').toUpperCase()];return r?{code:r[0],name:r[1],continent:r[3],country:r[4],city:r[5],tz:r[6]}:apt(c);};
  const titleM=txt.match(/<title>([^<]+)<\/title>/i);
  let name=String(raw.owner||'').trim()||defaultOwner(raw.storageKey);
  if(!name)name=String(fileName||'').replace(/\.html?$/i,'').replace(/^(?:DatabaseVoli|SkyLog)[_\-\s]*/i,'').trim();
  if(!name&&titleM)name=titleM[1].replace(/(?:SkyLog|Logbook)[\s·—\-]*/gi,'').replace(/^voli$/i,'').trim();
  if(!name)name='SkyLog ospite';
  const flights=enrichFlights(Array.isArray(raw.flights)?raw.flights:[],apLook);
  const rawPlanned=Array.isArray(raw.planned)?raw.planned:[];
  const llOf=c=>{const r=apMap[String(c||'').toUpperCase()];if(r&&typeof r[IDX.lat]==='number'&&typeof r[IDX.lon]==='number')return [r[IDX.lat],r[IDX.lon]];return aptLL(c);};
  const plannedPre=rawPlanned.map((p,i)=>{
    const A=llOf(p.from),B=llOf(p.to);
    const d=Number(p.dist)>0?Number(p.dist):(A&&B?Math.round(haversineKm(A,B)):'');
    return {...p,id:p.id||('pp_'+i),dist:d};

 if(fly){const k=Math.min(1,(now-fly.t0)/fly.d),q=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;camG.lam=fly.l0+fly.dl*q;camG.phi=fly.p0+fly.dp*q;if(k>=1)fly=null;moving=true;}
 }
 if(moving||dirty){camG.lam=wrapPi(camG.lam);dirty=false;draw(now);}
 raf=requestAnimationFrame(loop);
 }
 const onVis=()=>{if(document.hidden)cancelAnimationFrame(raf);else if(alive){last=performance.now();dirty=true;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}};
 window.addEventListener('resize',resize);document.addEventListener('visibilitychange',onVis);
 resize();updBtn();raf=requestAnimationFrame(loop);
 return {destroy(){alive=false;cancelAnimationFrame(raf);window.removeEventListener('resize',resize);document.removeEventListener('visibilitychange',onVis);}};
}

const VIEWS={overview:['panoramica',vOverview],globe:['globo',vGlobe],flights:['voli',vFlights],planned:['programma',vPlanned],aircraft:['aerei',vAircraft],airports:['aeroporti',vAirports],countries:['paesi',vCountries]};
function fromHash(){const h=decodeURIComponent(location.hash.slice(1));return Object.keys(VIEWS).find(k=>VIEWS[k][0]===h)||'overview';}
function go(v){if(location.hash!=='#'+VIEWS[v][0])location.hash=VIEWS[v][0];else{ui.view=v;render(true);}}
function renderYearPopover(){
 const years=allYears();
 if(ui.year!=='all'&&!years.includes(ui.year))ui.year='all';
 const btn=document.getElementById('globalYearBtn'),lbl=document.getElementById('globalYearLbl'),menu=document.getElementById('globalYearMenu');
 if(!btn||!lbl||!menu)return;
 lbl.textContent=ui.year==='all'?'Tutti gli anni':String(ui.year);

 menu.innerHTML=`<button type="button" class="year-opt" role="option" data-year="all" aria-selected="${ui.year==='all'}"><span>Tutti gli anni</span>${CHK_SVG}</button>`+
 years.map(y=>`<button type="button" class="year-opt" role="option" data-year="${y}" aria-selected="${ui.year===y}"><span>${y}</span>${CHK_SVG}</button>`).join('');
}
function closeYearPopover(){
 const wrap=document.getElementById('globalYearWrap'),btn=document.getElementById('globalYearBtn'),menu=document.getElementById('globalYearMenu');
 if(wrap&&menu&&!menu.hidden){wrap.classList.remove('open');btn.setAttribute('aria-expanded','false');menu.hidden=true;}
}
function renderBrandMenu(){
 const menu=document.getElementById('brandMenu');
 if(!menu)return;
 const curLabel=String(S?.owner||'').trim();
 const arrSvg='<svg class="brand-link-arr" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8M6.5 2.5L10 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
 const rows=SKYLOGS.map(p=>{
  if(p.key===KEY){
   return `<button type="button" class="brand-item current" role="menuitem" aria-current="page" data-brand-cur><span>${esc(curLabel||p.name)}</span>${CHK_SVG}</button>`;
  }
  return `<a class="brand-item" role="menuitem" href="${esc(skylogHref(p))}"><span>${esc(p.name)}</span>${arrSvg}</a>`;
 }).join('');
 menu.innerHTML=`<div class="brand-menu-hd">Cambia SkyLog</div>${rows}`;
}
function closeBrandPopover(){
 const wrap=document.getElementById('brandWrap'),btn=document.getElementById('brandBtn'),menu=document.getElementById('brandMenu');
 if(wrap&&menu&&!menu.hidden){wrap.classList.remove('open');btn.setAttribute('aria-expanded','false');menu.hidden=true;}
}
document.getElementById('brandBtn')?.addEventListener('click',e=>{
 e.stopPropagation();
 closeIosSels();closeYearPopover();
 const wrap=document.getElementById('brandWrap'),btn=document.getElementById('brandBtn'),menu=document.getElementById('brandMenu');
 if(!wrap||!btn||!menu)return;
 const open=menu.hidden;
 if(open)renderBrandMenu();
 wrap.classList.toggle('open',open);btn.setAttribute('aria-expanded',String(open));menu.hidden=!open;
});
document.getElementById('brandMenu')?.addEventListener('click',e=>{
 if(e.target.closest('[data-brand-cur]')){e.stopPropagation();closeBrandPopover();}
});
document.getElementById('globalYearBtn').onclick=e=>{
 e.stopPropagation();
 closeIosSels();closeBrandPopover();
 const wrap=document.getElementById('globalYearWrap'),btn=document.getElementById('globalYearBtn'),menu=document.getElementById('globalYearMenu');
 const open=menu.hidden;
 wrap.classList.toggle('open',open);btn.setAttribute('aria-expanded',String(open));menu.hidden=!open;
};

function render(scroll){
 if(globe){globe.destroy();globe=null;}
 syncBrand();
 closeBrandPopover();
 closeYearPopover();
 closeIosSels();
 renderYearPopover();
 renderPeerBanner();
 document.body.classList.toggle('is-globe',ui.view==='globe');
 document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===ui.view)));
 VIEWS[ui.view][1]();
 if(scroll)window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>{if(sheet.open)closeSheet(true);const next=fromHash();if(next==='globe'&&ui.view!=='globe')ui.globeColor=peer?'compare':'default';ui.view=next;render(true);});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){if(b.dataset.view==='globe'){ui.globeColor=peer?'compare':'default';ui.globeSingle=null;}go(b.dataset.view);}});

document.getElementById('menuBtn').onclick=()=>openSheet(menuSheet());

document.addEventListener('click',e=>{
 const sb=e.target.closest('.ios-sel-btn:not(#moreFltBtn)');
 if(sb){
 e.stopPropagation();
 const w=sb.closest('.ios-sel'),m=w.querySelector('.ios-sel-menu'),open=m.hidden;
 closeIosSels(w);closeYearPopover();closeBrandPopover();
 if(open){
  const box=(sb.closest('.sheet-body')||document.documentElement).getBoundingClientRect();
  const r=sb.getBoundingClientRect();
  const spaceBelow=Math.min(box.bottom,window.innerHeight)-r.bottom;
  const spaceAbove=r.top-Math.max(box.top,0);
  m.classList.toggle('up',spaceBelow<210&&spaceAbove>spaceBelow);
 }
 w.classList.toggle('open',open);sb.setAttribute('aria-expanded',String(open));m.hidden=!open;
 return;
 }
 const so=e.target.closest('[data-ios-opt]');
 if(so){
 e.stopPropagation();
 const w=so.closest('.ios-sel'),s=w.querySelector('select');
 if(s){
 s.value=so.dataset.iosOpt;
 syncIosSel(s);
 closeIosSels();
 s.dispatchEvent(new Event('change',{bubbles:true}));
 s.dispatchEvent(new Event('input',{bubbles:true}));
 }
 return;
 }
 if(!e.target.closest('.ios-sel'))closeIosSels();
 if(!e.target.closest('#globalYearWrap'))closeYearPopover();
 if(!e.target.closest('#brandWrap'))closeBrandPopover();
 if(!e.target.closest('#moreFltWrap')){const mp=document.getElementById('moreFltPop'),mb=document.getElementById('moreFltBtn');if(mp&&!mp.hidden){mp.hidden=true;if(mb)mb.setAttribute('aria-expanded','false');}}
 const t=e.target.closest('[data-flight],[data-ac],[data-ap],[data-year],[data-fa],[data-fc],[data-fm],[data-fall],[data-fmfg],[data-frange],[data-ovrange],[data-ovhabit],[data-fhour],[data-fday],[data-fseat],[data-fdeck],[data-fcountry],[data-fgroup],[data-pgroup],[data-cfilter],[data-cmpfilter],[data-country],[data-allcountry],[data-trip],[data-globetrip],[data-globeplantrip],[data-peer-clear],[data-cont],[data-allap],[data-allac],[data-globeflight],[data-globeplan],[data-route],[data-close],[data-kmmode],[data-expand],[data-newflight],[data-newplanned],[data-manage-airlines]');
 if(!t)return;
 const d=t.dataset;
 const resetF=()=>{ui.q='';F_KEYS.forEach(k=>ui[k]='all');};
 if(d.close!==undefined)closeSheet();
 else if(d.manageAirlines!==undefined)openSheet(airlinesSheet(),true);
 else if(d.peerClear!==undefined)exitPeer(true);
 else if(d.flight)openSheet(flightDetail(d.flight));
 else if(d.globetrip){const tr=buildTrips().find(x=>x.id===d.globetrip);if(tr){closeSheet(true);ui.globeColor='default';ui.globeSingle={type:'trip',id:tr.id};globeFlyTarget=[tr.first.from,tr.first.to];go('globe');}}
 else if(d.globeplantrip){const ptr=buildPlannedTrips(enrichPlannedList(S.planned)).find(x=>x.id===d.globeplantrip);if(ptr){closeSheet(true);ui.globeColor='default';ui.globeSingle={type:'plannedTrip',id:ptr.id};globeFlyTarget=[ptr.first.from,ptr.first.to];go('globe');}}
 else if(d.trip)openSheet(tripDetail(d.trip));
 else if(d.country)openSheet(countryDetail(d.country));
 else if(d.ac!==undefined){if(IDX.ac[d.ac]||peer?.ac?.[d.ac])openSheet(aircraftDetail(d.ac));}
 else if(d.ap)openSheet(airportDetail(d.ap));
 else if(d.year){ui.year=d.year==='all'?'all':+d.year;ui.globeSingle=null;closeYearPopover();render();}
 else if(d.kmmode){ui.kmMode=d.kmmode==='1';render();}
 else if(d.ovrange){ui.ovRangeMode=d.ovrange;render();}
 else if(d.ovhabit){ui.ovHabitMode=d.ovhabit;render();}
 else if(d.fgroup){ui.flightsGroup=d.fgroup;vFlights();}
 else if(d.pgroup){ui.plannedGroup=d.pgroup;vPlanned();}
 else if(d.cfilter){ui.countryFilter=d.cfilter;vCountries();}
 else if(d.cmpfilter){ui.countryCmpFilter=d.cmpfilter;vCountries();}
 else if(d.expand){ui.expand[d.expand]=!ui.expand[d.expand];render();}
 else if(d.route){resetF();ui.flightsGroup='singles';ui.q=d.route;go('flights');}
 else if(d.fa!==undefined||d.fc!==undefined){resetF();ui.flightsGroup='singles';ui.fa=d.fa!==undefined?d.fa:'all';ui.fc=d.fc!==undefined?d.fc:'all';go('flights');}
 else if(d.fm){resetF();ui.flightsGroup='singles';ui.fm=d.fm;go('flights');}
 else if(d.fall){resetF();ui.flightsGroup='singles';ui.fall=d.fall;go('flights');}
 else if(d.fmfg){resetF();ui.flightsGroup='singles';ui.fmfg=d.fmfg;go('flights');}
 else if(d.frange){resetF();ui.flightsGroup='singles';ui.frange=d.frange;go('flights');}
 else if(d.fhour){resetF();ui.flightsGroup='singles';ui.fhour=d.fhour;go('flights');}
 else if(d.fday){resetF();ui.flightsGroup='singles';ui.fday=d.fday;go('flights');}
 else if(d.fseat){resetF();ui.flightsGroup='singles';ui.fseat=d.fseat;go('flights');}
 else if(d.fdeck){resetF();ui.flightsGroup='singles';ui.fdeck=d.fdeck;go('flights');}
 else if(d.fcountry){resetF();ui.flightsGroup='singles';ui.fcountry=d.fcountry;go('flights');}
 else if(d.allcountry){closeSheet(true);resetF();ui.flightsGroup='singles';ui.fcountry=d.allcountry;go('flights');}
 else if(d.allap){closeSheet(true);resetF();ui.flightsGroup='singles';ui.q=d.allap;go('flights');}
 else if(d.allac){closeSheet(true);resetF();ui.flightsGroup='singles';ui.fac=d.allac;go('flights');}
 else if(d.cont){ui.apq='';ui.apCont=d.cont;go('airports');}
 else if(d.globeflight){const sf=S.flights.find(x=>x.id===d.globeflight);if(sf){closeSheet(true);ui.globeColor='default';ui.globeSingle={type:'flight',id:sf.id};globeFlyTarget=[sf.from,sf.to];go('globe');}}
 else if(d.globeplan){const sp=S.planned.find(x=>x.id===d.globeplan);if(sp){closeSheet(true);ui.globeColor='default';ui.globeSingle={type:'planned',id:sp.id};globeFlyTarget=[sp.from,sp.to];go('globe');}}
 else if(d.newflight!==undefined)openSheet(flightForm({date:todayISO()},{}));
 else if(d.newplanned!==undefined)openSheet(flightForm({},{mode:'planned'}));
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();downloadCopy();return;}
  if(e.key==='Escape'){
    if(sheet.open){if(dismissInnerSheetUI()){lastInnerEsc=Date.now();e.preventDefault();e.stopPropagation();}return;}
    closeBrandPopover();closeYearPopover();closeIosSels();return;
  }
  const tag=(e.target.tagName||'').toLowerCase();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-laygrp],[data-cont],[data-flight],[data-ap],[data-ac],[data-allac],[data-country],[data-trip],[data-fa],[data-fc],[data-fm],[data-fall],[data-fmfg],[data-frange],[data-route],[data-fhour],[data-fday],[data-fseat],[data-fdeck]')&&tag!=='button'&&tag!=='a'){e.preventDefault();e.target.click();return;}
  if(sheet.open||['input','textarea','select'].includes(tag)||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();openSheet(flightForm({date:todayISO()},{}));}
  else if(e.key==='/'){e.preventDefault();if(ui.view!=='flights')go('flights');setTimeout(()=>{const i=document.getElementById('fq');if(i)i.focus();},30);}
});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{S=normalizeState(JSON.parse(e.newValue));buildIndex();render();}catch(_){}}});

load();buildIndex();renderSaveState();ui.view=fromHash();render();
if(pendingConflict)openSheet(conflictSheet());
if(/^https?:$/i.test(location.protocol)&&'serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{});}
})();
